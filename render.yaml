services:
  # Backend Service
  - type: web
    name: alu-backend
    env: node
    rootDir: alu-backend
    plan: free
    healthCheckPath: /
    buildFilter:
      paths:
      - alu-backend/**
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # IMPORTANT: You must add your secrets (MONGODB_URI, GEMINI_API_KEY, etc.)
      # in the Render.com dashboard under Environment. Do not put them here.

  # Frontend Service
  - type: web
    name: alu-frontend
    env: node
    rootDir: alu-frontend
    plan: free
    buildFilter:
      paths:
      - alu-frontend/**
    # Frontend needs to install dependencies BEFORE building
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: alu-backend
          property: url